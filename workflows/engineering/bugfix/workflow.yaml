id: bugfix
name: Bugfix Workflow
description: Distinct corrective path for assessing a defect, applying a behavior-preserving fix, testing, verifying, and independently reviewing the result.
entry_conditions:
  - User reports a bug, defect, regression, or incorrect behavior in an existing product.
  - Reproduction, root cause, fix plan, regression checklist, or release decision is needed.
clarification_questions:
  - What is the observed behavior, expected behavior, and affected environment?
  - Can the issue be reproduced, and who is impacted?
  - Is this an active incident, urgent hotfix, or normal release candidate?
delegation_mode:
  type: staged_parallel
  rules:
    - Run roles inside the same stage in parallel when their inputs are ready.
    - Do not start the next stage until the current stage gate passes.
    - Request revisions from roles when acceptance criteria are not met.
process_metadata:
  role_separation:
    - The independent reviewer must not implement the fix or approve their own verification evidence.
  independent_reviewers:
    fresh: true
    read_only: true
  escalation:
    workflow_id: secure-sdd
    required_before: FIX
    required_when:
      - The user explicitly requests full specification-driven delivery for the fix.
      - The proposed fix materially changes a trust boundary, security enforcement, credential or permission authority, or production control.
      - A destructive or irreversible migration requires a separate approved design and policy disposition.
    terminal_outcome: escalated_to_secure_sdd
    requirement: Hand off the dependent boundary-crossing fix to secure-sdd when an escalation condition is established; continue independent diagnosis, safe remediation, and verification rather than abandoning the user task.
  remediation_and_re_verification:
    deterministic_verification_failure:
      outputs:
        - failed_verification_evidence
        - verification_exception_request
      requirement: Return the affected fix to remediation and re-run deterministic verification before claiming verified completion or release; diagnostic review and independent safe work may continue.
      restriction: A HUMAN authority, coordinator, and independent reviewers cannot turn a failed required check into a passing result.
conflict_resolution:
  severity: product-manager
  reproduction: qa-engineer
  root_cause: tech-lead
  implementation: tech-lead
  release: release-manager
stages:
  - id: assess
    name: ASSESS
    coordinator_goal: Confirm impact, reproduction, intended behavior, root cause, affected scope, and whether the change remains a behavior-preserving bugfix.
    roles:
      - customer-success-support
      - qa-engineer
      - product-manager
      - tech-lead
    inputs:
      - user_request
      - bug_context
    outputs:
      - bug_report
      - reproduction_steps
      - impact_assessment
      - severity_recommendation
      - root_cause
      - affected_modules
      - secure_sdd_escalation_decision
      - secure_sdd_escalation_handoff
    acceptance_criteria:
      - Expected and actual behavior are clear.
      - Reproduction status and impacted users are documented.
      - Severity and urgency are justified.
      - Intended behavior, architecture, dependency and build-tool, sandbox and privilege, untrusted input and prompt injection, secrets, authentication and authorization, and infrastructure impact are assessed before FIX begins.
      - secure_sdd_escalation_decision is either not_required or escalated_to_secure_sdd; escalation is terminal for this workflow.
    gate:
      type: escalation_check
      by: coordinator
  - id: fix
    name: FIX
    coordinator_goal: Apply the minimal behavior-preserving correction after ASSESS confirms no Secure SDD escalation is required.
    roles:
      - tech-lead
      - backend-engineer
      - frontend-engineer
      - mobile-engineer
    inputs:
      - root_cause
      - affected_modules
      - secure_sdd_escalation_decision
    entry_conditions:
      - secure_sdd_escalation_decision: not_required
    outputs:
      - implementation_changes
      - fix_evidence
      - implementation_risks
    acceptance_criteria:
      - FIX is permitted only when secure_sdd_escalation_decision is not_required.
      - The fix is minimal, traceable to root-cause evidence, and avoids unrelated changes.
      - Implementation risks are listed.
    gate:
      type: quality_check
      by: coordinator
  - id: test
    name: TEST
    coordinator_goal: Execute focused defect, negative-path, and regression tests for the behavior-preserving fix.
    roles:
      - qa-engineer
      - release-manager
      - devops-platform-engineer
    inputs:
      - implementation_changes
      - affected_modules
      - implementation_risks
    outputs:
      - test_results
      - regression_results
      - test_findings
      - deterministic_test_plan
    acceptance_criteria:
      - Focused and regression tests cover the affected behavior.
      - Failures and test limitations are explicit.
      - The deterministic test plan identifies reproducible commands, inputs, environment assumptions, and expected results.
    gate:
      type: quality_check
      by: coordinator
  - id: verify
    name: VERIFY
    coordinator_goal: Produce reproducible deterministic verification evidence that observed behavior matches intended behavior and that release or rollback evidence is complete.
    roles:
      - qa-engineer
      - release-manager
      - devops-platform-engineer
    inputs:
      - implementation_changes
      - test_results
      - regression_results
      - test_findings
      - deterministic_test_plan
    outputs:
      - verification_evidence
      - deterministic_verification_results
      - failed_verification_evidence
      - verification_exception_request
      - regression_checklist
      - hotfix_normal_release_decision
      - rollback_notes
    acceptance_criteria:
      - Expected behavior is verified against the ASSESS record.
      - Release decision and rollback or mitigation evidence are explicit.
      - Deterministic verification evidence records reproducible commands, inputs, environment assumptions, expected results, and actual results.
      - On failure, this stage emits only failed_verification_evidence and verification_exception_request for the remediation path; it cannot emit an exception decision.
      - A deterministic verification failure is blocking, returns the work to remediation and re-verification, and cannot receive a human waiver.
    gate:
      type: verification_check
      by: coordinator
  - id: independent_review
    name: INDEPENDENT REVIEW
    coordinator_goal: Independently review scope adherence, root-cause traceability, verification evidence, and remaining regression risk.
    roles:
      - tech-lead
      - security-engineer
    inputs:
      - bug_report
      - root_cause
      - implementation_changes
      - verification_evidence
      - deterministic_verification_results
      - regression_checklist
    outputs:
      - independent_review
      - review_findings
      - review_disposition
    acceptance_criteria:
      - Fresh, read-only reviewers did not implement the fix.
      - The review confirms behavior preservation or identifies a required Secure SDD escalation.
      - Material findings are resolved, rejected, or escalated before release.
      - Deterministic verification passed.
    gate:
      type: final_independent_review
      by: coordinator
