          semantic_conditions: []
        requirements:
          - Treat Invoke-Expression, dynamic script blocks, download-and-execute, and untrusted module installation as high risk.
          - Pin and review modules before use.
          - Do not weaken execution or security policy as a workaround.
          - Use ScriptAnalyzer or the configured equivalent.
    tools:
      - id: SDD-TOOL-GIT-DEPS-001
        group: git_dependencies_and_submodules
        ecosystems:
          - git
        risk: MEDIUM
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - .gitmodules
            lockfiles: []
            config_files: []
          semantic_conditions:
            - dependency_manifest_contains_git_source
        requirements:
          - Pin immutable commits and avoid branches, latest, and moving tags without verified integrity.
          - Verify repository ownership and origin.
          - Treat URL or commit changes as dependency changes subject to full review.
      - id: SDD-TOOL-HOOKS-001
        group: pre_commit_and_git_hooks
        ecosystems:
          - pre_commit
          - lefthook
          - husky
          - git_hooks
        risk: HIGH
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - .pre-commit-config.yaml
              - lefthook.yml
              - lefthook.yaml
            lockfiles: []
            config_files:
              - .husky/**
              - .git/hooks/**
          semantic_conditions: []
        requirements:
          - Treat third-party hooks as executable dependencies and pin immutable revisions.
          - Do not automatically execute newly introduced hooks on the host before review.
          - Perform initial execution in the sandbox.
      - id: SDD-TOOL-IDE-001
        group: ide_editor_extensions
        ecosystems:
          - vscode
          - intellij_platform
        risk: HIGH
        enforcement: human_gate
        trust_boundary: HUMAN
        applicability:
          path_globs:
            manifests:
              - .vscode/extensions.json
            lockfiles: []
            config_files:
              - .vscode/**
              - .idea/**
          semantic_conditions: []
        requirements:
          - Do not automatically install extensions, language-server plugins, debug adapters, or IDE plugins from repository recommendations.
          - Review identity, publisher, version, permissions, update behavior, and provenance before installation.
          - Pin versions where the platform supports it.
          - HUMAN approval applies to installing a new privileged extension or expanding its authority, not reading or editing a recommendation file by itself.
      - id: SDD-TOOL-OS-PACKAGES-001
        group: os_package_managers
        ecosystems:
          - apt
          - dnf
          - yum
          - zypper
          - apk
          - pacman
          - brew
          - winget
          - choco
        risk: MEDIUM
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - Dockerfile*
              - Containerfile*
            lockfiles: []
            config_files: []
          semantic_conditions:
            - repository_setup_script_adds_or_changes_os_package_source
            - host_or_image_package_manager_configuration_present_or_changed
        requirements:
          - Do not modify host or system packages merely to satisfy project dependencies; host mutation needs its own confirmed target and authorization.
          - Prefer an approved image, sandbox, or project-local toolchain.
          - A Dockerfile or Containerfile match alone is not a host-package change or HUMAN gate. Isolated image-layer package changes require dependency scrutiny; new repositories, signing keys, PPAs, and host package mutations cross a HUMAN trust boundary.
          - In a disposable Docker or Podman image, installation from existing official distribution repositories is routine when authenticated repository metadata and package integrity remain enabled, resolved package identities and versions are recorded, and no host secrets, privileged sockets, or writable host roots are exposed. Apply distro-native checks, not application-registry publication-age or lockfile rules.
          - Distribution packages may run maintainer scripts. Allow necessary container-local root only during image installation; run subsequent project code without it. Prefer verified package download followed by offline installation; if scripts must execute with network access, assess that execution and its exposed data separately rather than treating it as data-only fetch.
      - id: SDD-TOOL-CONTAINER-001
        group: containers
        ecosystems:
          - docker
          - podman
          - buildah
          - compose
          - oci
        risk: MEDIUM
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - Dockerfile*
              - Containerfile*
              - compose*.yaml
              - compose*.yml
              - docker-compose*.yaml
              - docker-compose*.yml
            lockfiles: []
            config_files:
              - .dockerignore
              - containers.conf
          semantic_conditions: []
        requirements:
          - Treat base images as dependencies and pin versions or immutable digests for high assurance.
          - Reject privileged defaults, host runtime sockets, unnecessary capabilities, and secret persistence in arguments, environment, or layers.
          - Prefer non-root runtime, read-only filesystems, bounded resources, and ephemeral secret mounts.
          - Review downloads, package repositories, setuid files, services, and COPY scope.
          - Scan images and retain SBOM or provenance when required by project policy.
          - A Dockerfile or container runtime match alone does not establish HIGH risk or require host-wide firewall/cgroup proof. Escalate actual privileged mounts, host runtime sockets, exposed credentials, expanded authority, or unverified isolation for the affected operation.
      - id: SDD-TOOL-KUBERNETES-001
        group: kubernetes
        ecosystems:
          - kubernetes
          - kubectl
          - kustomize
        risk: CRITICAL
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - k8s/**/*.yaml
              - kubernetes/**/*.yaml
              - manifests/**/*.yaml
            lockfiles: []
            config_files:
              - kustomization.yaml
              - kustomization.yml
              - kubeconfig
          semantic_conditions: []
        requirements:
          - Review cluster-wide RBAC, host namespaces, host paths, privileged mode, capabilities, tokens, ports, and unsafe sysctls.
          - Prefer namespaced least privilege, dedicated service accounts, non-root workloads, read-only root filesystems, seccomp, and appropriate network policy.
          - Separate rendering and static validation from deployment authority.
          - Never apply to production from an ordinary agent sandbox.
        deployment_gate:
          enforcement: human_gate
          trust_boundary: HUMAN
          rule: Activate before deployment to production, not for manifest inspection, rendering, or local validation.
      - id: SDD-TOOL-HELM-001
        group: helm
        ecosystems:
          - helm
        risk: HIGH
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - Chart.yaml
              - charts/**/Chart.yaml
            lockfiles:
              - Chart.lock
              - charts/**/Chart.lock
            config_files:
              - values*.yaml
              - templates/**
          semantic_conditions: []
        requirements:
          - Pin chart versions and verify provenance or signatures where available.
          - Review dependencies, repositories, hooks, CRDs, RBAC, security contexts, host mounts, post-renderers, and plugins.
          - Do not automatically install Helm plugins.
          - Render, statically verify, and security-check before separately authorized deployment.
      - id: SDD-TOOL-TERRAFORM-001
        group: terraform_opentofu
        ecosystems:
          - terraform
          - opentofu
        risk: CRITICAL
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - '*.tf'
              - '*.tofu'
            lockfiles:
              - .terraform.lock.hcl
            config_files:
              - '*.tfvars'
              - '*.tfvars.json'
              - '*.tfbackend'
              - .terraformrc
          semantic_conditions: []
        requirements:
          - Require and review .terraform.lock.hcl and verify provider checksums.
          - Pin provider and module sources to bounded versions or immutable revisions.
          - Review backends, provisioners, external data, local-exec, remote-exec, provider sources, and module sources.
          - Treat init, providers, plugins, and external modules as dependency execution in isolation.
          - Protect state as secret-bearing data.
        apply_gate:
          enforcement: human_gate
          trust_boundary: HUMAN
          rule: Never automatically apply to production from an ordinary coding-agent workflow.
      - id: SDD-TOOL-ANSIBLE-001
        group: ansible
        ecosystems:
          - ansible
          - ansible_galaxy
        risk: HIGH
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - requirements.yml
              - galaxy.yml
            lockfiles: []
            config_files:
              - ansible.cfg
              - inventories/**
              - group_vars/**
              - host_vars/**
              - playbooks/**/*.yml
          semantic_conditions: []
        requirements:
          - Treat roles, collections, modules, plugins, and inventory scripts as executable dependencies.
          - Pin Galaxy role and collection versions and avoid arbitrary remote role sources.
          - Use least-privileged credentials and disposable targets for tests where practical.
          - Do not treat check mode as proof of safety.
        production_gate:
          enforcement: human_gate
          trust_boundary: HUMAN
          rule: Activate before applying changes to production systems, not before local check-mode inspection.
      - id: SDD-TOOL-CICD-001
        group: ci_cd
        ecosystems:
          - github_actions
          - gitlab_ci
          - jenkins
          - circleci
          - buildkite
        risk: CRITICAL
        enforcement: human_gate
        trust_boundary: HUMAN
        applicability:
          path_globs:
            manifests:
              - .github/workflows/**
              - .gitlab-ci.yml
              - Jenkinsfile
              - .circleci/**
              - .buildkite/**
            lockfiles: []
            config_files:
              - ci/**
          semantic_conditions: []
        requirements:
          - Require HUMAN approval and independent security review before changing CI secrets, tokens, write permissions, deploy authority, or execution of untrusted code; inspection and non-authoritative edits alone do not activate that gate.
          - Use minimal token permissions, immutable third-party components, and no secrets for untrusted code.
          - Separate build and test contexts from deployment authority.
          - Never combine untrusted code, repository secrets, and write permissions in one execution context.
          - Do not interpolate untrusted contribution data directly into shell commands.
      - id: SDD-TOOL-GITHUB-ACTIONS-001
        group: github_actions
        ecosystems:
          - github_actions
        risk: CRITICAL
        enforcement: static_validation
        applicability:
          path_globs:
            manifests:
              - .github/workflows/*.yml
              - .github/workflows/*.yaml
            lockfiles: []
            config_files:
              - .github/actions/**
          semantic_conditions: []
        requirements:
          - Treat each uses reference as an executable dependency.
          - Pin third-party actions to immutable commit SHAs for high assurance.
          - Declare explicit minimal GITHUB_TOKEN permissions.
          - Never execute untrusted pull-request code with powerful secrets or write permissions.
        change_gate:
          enforcement: human_gate
          trust_boundary: HUMAN
          rule: Activate for a material GitHub Actions trust or permission change, not a path match or read-only inspection.
      - id: SDD-TOOL-INFRA-PLUGINS-001
        group: infrastructure_plugins
        ecosystems:
          - kubectl_plugins
          - helm_plugins
          - terraform_providers
          - packer_plugins
          - ansible_collections
          - ci_plugins
          - language_servers
          - code_generators
          - protoc_plugins
        risk: HIGH
        enforcement: runtime_preflight
        applicability:
          path_globs:
            manifests: []
            lockfiles: []
            config_files: []
          semantic_conditions:
            - plugin_or_extension_manifest_present_or_changed
            - plugin_lock_or_checksum_state_present_or_changed
            - infrastructure_or_development_plugin_configuration_present_or_changed
        requirements:
          - Treat infrastructure, CI, language-server, generator, and protocol plugins as executable dependencies.
          - Apply dependency review, quarantine, integrity checks, and sandbox execution before installation.
          - Do not install plugins globally or automatically in the control environment.
      - id: SDD-TOOL-CODEGEN-001
        group: code_generation
        ecosystems:
          - protobuf
          - openapi
          - orm
          - graphql
          - sdk
          - compiler_plugins
          - macros
        risk: HIGH
        enforcement: runtime_preflight
        applicability:
          path_globs:
            manifests: []
            lockfiles: []
            config_files:
              - '*codegen*'
              - buf.gen.yaml
              - openapi-generator*.yaml
          semantic_conditions:
            - generator_dependency_manifest_present_or_changed
            - generator_dependency_lock_state_present_or_changed
        requirements:
          - Pin and review generator identity and version as an executable dependency.
          - Execute generators inside the sandbox without unnecessary credentials or network access.
          - Treat generated output as untrusted until review, tests, static analysis, and applicable security verification pass.
      - id: SDD-TOOL-MIGRATIONS-001
        group: database_migration_tools
        ecosystems:
          - flyway
          - liquibase
          - alembic
          - django
          - rails
          - prisma
          - orm_migrations
        risk: HIGH
        enforcement: static_validation
        applicability:
          path_globs:
            manifests: []
            lockfiles: []
            config_files:
              - migrations/**
              - alembic.ini
              - prisma/schema.prisma
              - liquibase*.yaml
              - flyway.conf
          semantic_conditions:
            - migration_tool_dependency_manifest_present_or_changed
            - migration_tool_dependency_lock_state_present_or_changed
        requirements:
          - Review generated migrations and inspect drops, truncation, rewrites, locks, non-transactional operations, and irreversible transformations.
          - Require rollback or recovery planning for high-risk migrations.
          - Never automatically execute destructive or production migrations.
        production_or_destructive_gate:
          enforcement: human_gate
          trust_boundary: HUMAN
          rule: Activate before production or destructive migrations, not for local reversible migration review.
      - id: SDD-TOOL-SECRETS-001
        group: secrets_and_credentials_tooling
        ecosystems:
          - environment_files
          - secret_store_clients
          - ci_secret_injection
        risk: CRITICAL
        enforcement: runtime_preflight
        applicability:
          path_globs:
            manifests: []
            lockfiles: []
            config_files:
              - .env
              - .env.*
              - '**/.env'
              - '**/.env.*'
              - '*.tfvars'
              - '*.tfvars.json'
              - '**/*.tfvars'
              - '**/*.tfvars.json'
          semantic_conditions:
            - secret_store_or_identity_manifest_present_or_changed
            - configuration_content_matches_an_explicit_credential_bearing_selector
        requirements:
          - Never place secrets in source, lockfiles, image layers, CI logs, generated artifacts, committed variable files, fixtures, or prompts.
          - Use approved secret stores and ephemeral injection.
          - Expose the minimum credential only to the required process, duration, and permission scope.
          - Never copy the control environment credential set into a sandbox.
          - Redact secret values from validation output and artifacts.
        access_gate:
          enforcement: human_gate
          trust_boundary: HUMAN
          rule: Activate before access to secret values or expanded credential authority, not for inspecting configuration structure without revealing values.
      - id: SDD-TOOL-UNKNOWN-001
        group: unknown_toolchains
        ecosystems:
          - unknown
        risk: MEDIUM
        enforcement: static_validation
        applicability:
          path_globs:
            manifests: []
            lockfiles: []
            config_files: []
          semantic_conditions:
            - unrecognized_dependency_or_build_manifest_present_or_changed
            - unrecognized_lock_or_integrity_state_present_or_changed
            - unrecognized_tool_configuration_present_or_changed
        requirements:
          - Identify the package, plugin, build, and execution model.
          - Identify lock, integrity, provenance, lifecycle-hook, network, and credential behavior.
          - Pin dependencies and tooling where possible.
          - Resolve and fetch in a dependency sandbox, then build, test, and execute in a verification sandbox.
          - Do not assume an unfamiliar package manager or tool is safe by default. Investigate before executing unfamiliar code; escalate a concrete unresolved integrity, authority, or containment risk, not unfamiliarity or read-only inspection by itself.
          - Escalate when safe isolation or integrity verification cannot be established.
