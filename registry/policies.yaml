        requirements:
          - Treat all build configuration as executable code.
          - Pin external sources to immutable versions, commits, and checksums where supported.
          - Review FetchContent, ExternalProject, custom commands, toolchain files, recipes, ports, overlays, repository rules, and downloaded binaries.
          - Run third-party build scripts in the sandbox and never run downloaded bootstrap scripts directly on the host.
      - id: SDD-ECO-SWIFT-001
        group: swift_objective_c
