# Reasoning/thinking API parameters per provider, verified from official docs (Jul 2026).
# Used to translate the normalized registry reasoning level (see reasoning_tier_map and the
# per-model `level` field) into provider-specific request parameters at generation/runtime.
reasoning:
  openai:
    param_name: "reasoning.effort"
    accepted_values: [none, minimal, low, medium, high, xhigh]
    scope: "per-request"
    supporting_models: "GPT-5.x family and o-series; gpt-4o does NOT support it"
    default: "medium"
    max_variant_concept: "xhigh is the highest level; reasoning.mode=pro selects heavier execution on GPT-5.6; gpt-5-pro is fixed high-only"
    source_url: "https://developers.openai.com/api/docs/guides/reasoning"
    notes: "Per-model subsets apply. Reasoning tokens billed as output. Only carried across turns in the stateful Responses API."
  anthropic:
    param_name: "effort (output_config.effort); legacy thinking.budget_tokens"
    accepted_values: [low, medium, high, xhigh, max]
    scope: "per-request (Messages API)"
    supporting_models: "Fable 5, Mythos 5, Opus 4.8/4.7/4.6/4.5, Sonnet 5/4.6. xhigh subset: Fable 5, Mythos 5, Opus 4.8/4.7, Sonnet 5. max subset adds Opus 4.6, Sonnet 4.6."
    default: "high"
    max_variant_concept: "max = absolute highest thinking depth (newest models); xhigh = extended long-horizon agentic"
    source_url: "https://platform.claude.com/docs/en/build-with-claude/effort"
    notes: "Opus 4.8/4.7 and Sonnet 5 reject manual thinking.type=enabled; use effort. budget_tokens deprecated but functional on 4.6."
  google:
    param_name: "thinkingConfig.thinking_level; legacy thinkingConfig.thinking_budget"
    accepted_values: [minimal, low, medium, high]
    scope: "per-request (generateContent)"
    supporting_models: "Gemini 3.x and 2.5 models; per-model subsets (e.g. 3.1-pro: low/medium/high; 3.5-flash: all four)"
    default: "model-dependent (high for Pro/Flash 3.x; medium for 3.5-flash)"
    max_variant_concept: "No max/xhigh; high is highest (dynamic/adaptive). Numeric budget ceiling is the alternative."
    source_url: "https://ai.google.dev/gemini-api/docs/thinking"
    notes: "thinking_level and thinking_budget cannot be combined."
  xai:
    param_name: "reasoning_effort; reasoning.effort (Responses API)"
    accepted_values: [low, medium, high, xhigh]
    scope: "per-request"
    supporting_models: "grok-4.5 (low/medium/high); grok-4.20-multi-agent (low/medium/high/xhigh). Reasoning always-on."
    default: "high"
    max_variant_concept: "xhigh controls multi-agent depth on grok-4.20"
    source_url: "https://docs.x.ai/developers/model-capabilities/text/reasoning"
    notes: "Reasoning cannot be disabled. presencePenalty/frequencyPenalty/stop rejected on reasoning models."
  deepseek:
    param_name: "thinking.type (enabled|disabled); reasoning_effort"
    accepted_values: "thinking.type: [enabled, disabled]; reasoning_effort: [high, max]"
    scope: "per-request"
    supporting_models: "deepseek-v4-pro, deepseek-v4-flash (thinking and non-thinking modes)"
    default: "thinking enabled; reasoning_effort high (auto max for complex agent requests)"
    max_variant_concept: "max for complex agentic requests"
    source_url: "https://api-docs.deepseek.com/guides/thinking_mode"
    notes: "low/medium mapped to high; xhigh mapped to max. CoT returned in reasoning_content."
  qwen:
    param_name: "enable_thinking (bool); thinking_budget (int)"
    accepted_values: "enable_thinking: [true, false]; thinking_budget: integer token count"
    scope: "per-request (extra_body / DashScope)"
    supporting_models: "Qwen3.7/3.6/3.5 (default true), Qwen3/Qwen3-VL/Qwen3-Omni (default false), QwQ/-thinking (always-on)"
    default: "enable_thinking: true (3.7/3.6/3.5); false (Qwen3 family)"
    max_variant_concept: "thinking_budget caps tokens; no named max level"
    source_url: "https://docs.qwencloud.com/developer-guides/text-generation/thinking"
    notes: "/think and /no_think toggle per turn. preserve_thinking carries reasoning across turns (3.7/3.6)."
  z-ai:
    param_name: "thinking.type (enabled|disabled); reasoning_effort"
    accepted_values: "thinking.type: [enabled, disabled]; reasoning_effort: [none, minimal, low, medium, high, xhigh, max]"
    scope: "per-request"
    supporting_models: "thinking.type: GLM-4.5+; reasoning_effort: GLM-5.2+ only. GLM-4.7/4.5V forced thinking."
    default: "thinking.type enabled; reasoning_effort max"
    max_variant_concept: "max on GLM-5.2+; low/medium mapped to high, xhigh mapped to max"
    source_url: "https://docs.z.ai/guides/capabilities/thinking"
    notes: "reasoning_effort has no effect unless thinking.type=enabled. zai-coding endpoint preserves thinking by default."
  kimi:
    param_name: "thinking.type (enabled|disabled); thinking.keep (null|all)"
    accepted_values: "thinking.type: [enabled, disabled]; thinking.keep: [null, all]"
    scope: "per-request"
    supporting_models: "kimi-k2.5 (type only); k2.6 (type+keep); k2.7-code/k2-thinking always-on"
    default: "thinking.type enabled; keep null"
    max_variant_concept: "No multi-level effort; on/off plus preserved thinking only"
    source_url: "https://platform.kimi.ai/docs/guide/use-kimi-k2-thinking-model"
    notes: "Moonshot rejects both reasoning_effort and thinking together. No multi-level effort control."
  minimax:
    param_name: "thinking.type (adaptive|disabled) [Chat Completions]; reasoning.effort (none|minimal|low|medium|high) [Responses API, M3]"
    accepted_values: "thinking.type: [adaptive, disabled]; reasoning.effort: [none, minimal, low, medium, high]"
    scope: "per-request"
    supporting_models: "MiniMax-M3 (full thinking.type control); M2.x always-on thinking"
    default: "thinking adaptive (on); Responses reasoning off (effort none)"
    max_variant_concept: "No depth tuning; reasoning effectively binary on/off"
    source_url: "https://platform.minimax.io/docs/api-reference/text-openai-api"
    notes: "effort values only toggle on/off on M3, do not tune depth."
  mimo:
    param_name: "thinking.type (enabled|disabled); enable_thinking (bool, Alibaba Model Studio)"
    accepted_values: "thinking.type: [enabled, disabled]; enable_thinking: [true, false]"
    scope: "per-request"
    supporting_models: "mimo-v2.5-pro, mimo-v2.5, mimo-v2-pro, mimo-v2-omni (thinking on by default); mimo-v2-flash"
    default: "enabled (on)"
    max_variant_concept: "No multi-level effort; on/off only. Does not support reasoning_effort/thinking_budget."
    source_url: "https://mimo.mi.com/docs/en-US/quick-start/usage-guide/other/deep-thinking"
    notes: "Pass thinking via extra_body. reasoning_content must be passed back in multi-turn tool calls."
  openrouter:
    param_name: "reasoning.effort / reasoning_effort / reasoning.max_tokens"
    accepted_values: "reasoning.effort: [none, minimal, low, medium, high, xhigh, max]; reasoning_effort top-level omits max"
    scope: "per-request (gateway normalizes across providers)"
    supporting_models: "Any reasoning-capable model in the catalog"
    default: "inferred from model; default_effort/default_enabled per-model"
    max_variant_concept: "max ~95% of max_tokens; reasoning.mode=pro routes to *-pro variants; :nitro is speed not reasoning"
    source_url: "https://openrouter.ai/docs/api/reference/parameters"
    notes: "Only ONE of reasoning and reasoning_effort allowed (else 400). Maps effort to provider-specific params."
  z-ai-coding:
    param_name: "thinking.type (enabled|disabled); reasoning_effort (zai-coding coding endpoint)"
    accepted_values: "thinking.type: [enabled, disabled]; reasoning_effort: [none, minimal, low, medium, high, xhigh, max]"
    scope: "per-request (zai-coding coding plan endpoint)"
    supporting_models: "zai-coding/glm-4.5-air, glm-4.7, glm-5.1, glm-5.2, glm-5-turbo (uppercase model IDs)"
    default: "thinking.type enabled; reasoning_effort max; clear_thinking false (Preserved Thinking on)"
    max_variant_concept: "max on GLM-5.2+; same alias mapping as z-ai"
    source_url: "https://docs.z.ai/guides/capabilities/thinking"
    notes: "Reuses z-ai thinking schema. Coding endpoint base https://api.z.ai/api/coding/paas/v4. Preserved Thinking enabled by default (keep=reasoning_content)."

# Normalized reference reasoning level per seniority tier. Every preset now declares its
# own level in recommended_defaults, which is the generator source of truth; this map is
# retained for catalog guidance and future presets that need a documented baseline.
reasoning_tier_map:
  junior: low
  middle: medium
  senior: high
  lead: max
