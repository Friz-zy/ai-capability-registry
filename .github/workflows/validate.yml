name: Validate Registry

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/validate.yml'
      - 'registry/**'
      - 'workflows/**'
      - 'templates/**'
      - 'security/**'
      - 'AGENTS.md.sdd'
      - '.gitmodules'
      - 'tests/**'
      - 'configs/**'
      - 'roles/**'
      - 'mcp/**'
      - 'skill-catalog.d/**'
      - 'skill-catalog.md'
      - 'workflows-catalog.md'
      - 'mcp-catalog.md'
      - 'skills/**'
      - 'scripts/**'
      - 'external/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate.yml'
      - 'registry/**'
      - 'workflows/**'
      - 'templates/**'
      - 'security/**'
      - 'AGENTS.md.sdd'
      - '.gitmodules'
      - 'tests/**'
      - 'configs/**'
      - 'roles/**'
      - 'mcp/**'
      - 'skill-catalog.d/**'
      - 'skill-catalog.md'
      - 'workflows-catalog.md'
      - 'mcp-catalog.md'
      - 'skills/**'
      - 'scripts/**'
      - 'external/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Validate registry
        run: python scripts/validate-registry.py
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Sync external submodules
        run: ./scripts/update-external.py
      - name: Generate skill catalog chunks and skills tree
        run: ./scripts/discover-skills.py
      - name: Generate workflow routing outputs
        run: ./scripts/generate-workflows.py
      - name: Generate security rule routing outputs
        run: python scripts/generate-security-rules.py
      - name: Generate role prompt outputs
        run: ./scripts/generate-roles.py
      - name: Generate tracked CLI agent configuration outputs
        run: |
          python scripts/generate-agent-configs.py --cli amazon-kiro --output configs/amazon-kiro
          python scripts/generate-agent-configs.py --cli claude-code --output configs/claude-code
          python scripts/generate-agent-configs.py --cli codex --output configs/codex
          python scripts/generate-agent-configs.py --cli kilo-code --output configs/kilo-code
          python scripts/generate-agent-configs.py --cli opencode --output configs/opencode
      - name: Verify managed CLI artifacts match fresh generation
        run: python scripts/generate-agent-configs.py --verify-managed-outputs
      - name: Check for generated changes
        run: |
          set -euo pipefail
          generated_changes="$(git status --porcelain)"
          if [ -n "$generated_changes" ]; then
            git diff --stat
            echo "Generated files are out of sync. Run the documented generators and commit the result."
            git diff
            exit 1
          fi
